<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login & Registration | GlowUp ✨</title>
    <link rel="stylesheet" href="login.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div class="container">
        <!-- LOGIN FORM -->
        <div class="form-box login">
            <form id="loginForm"> 
               <h1>Login 🌸</h1>
                <div class="input-box">
                    <i class="fa-solid fa-user"></i>
                    <input type="text" id="loginUsername" placeholder="Username" autocomplete="username" required>
                </div>
                <div class="input-box">
                    <i class="fa-solid fa-lock"></i>
                    <input type="password" id="loginPassword" placeholder="Password" autocomplete="current-password" required>
                </div>
                <button type="submit" class="btn">Login ✨</button> 
            </form>
        </div>
        <div class="form-box register"> 
            <form id="registerForm">
                <h1>Registration 💖</h1>
                <div class="input-box">  
                    <i class="fa-solid fa-user"></i>
                    <input type="text" id="regUsername" placeholder="Username" autocomplete="username" required>
                </div>
                <div class="input-box">
                    <i class="fa-solid fa-envelope"></i>
                    <input type="email" id="regEmail" placeholder="Email" autocomplete="email" required>
                </div>
                <div class="input-box">
                    <i class="fa-solid fa-lock"></i>
                    <input type="password" id="regPassword" placeholder="Password" autocomplete="new-password" required>
                </div>
                <div class="input-box">
                    <i class="fa-solid fa-lock"></i>
                    <input type="password" id="regConfirmPassword" placeholder="Confirm your password" autocomplete="new-password" required>
                </div>
                <button type="submit" class="btn">Register ✨</button>
            </form>
        </div>
        <!-- TOGGLE PANELS -->
        <div class="toggle-box">
            <div class="toggle-panel toggle-left">
                <h1>Hello, Welcome! 🌸</h1>
                <p>Don't have an account?</p>
                <button type="button" class="btn register-btn">Register</button>
            </div>
            <div class="toggle-panel toggle-right"> 
                <h1>Welcome Back! ✨</h1>
                <p>Already have an account?</p>
                <button type="button" class="btn login-btn">Login</button>
            </div>
        </div>
    </div>
    <script src="jspart.js" defer></script>
</body>
</html>
